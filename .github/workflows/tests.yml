name: Integration tests

on:
  push:
    branches: [feat/configurable-polling]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install pytest-homeassistant-custom-component==0.13.375 ruff
      - name: Lint changed integration modules
        run: >-
          ruff check --select F,E9
          custom_components/tarifas_energia_brasil/__init__.py
          custom_components/tarifas_energia_brasil/config_flow.py
          custom_components/tarifas_energia_brasil/const.py
          custom_components/tarifas_energia_brasil/coordinator.py
          custom_components/tarifas_energia_brasil/database.py
          custom_components/tarifas_energia_brasil/sensor.py
          tests
      - name: Run integration tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -p no:cacheprovider
